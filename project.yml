name: SwiftRepos
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.10.0
targets:
  SwiftRepos:
    type: application
    platform: iOS
    sources: [SwiftRepos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cmu.dbaldsin.SwiftRepos
    dependencies:
      - package: Alamofire
  SwiftReposTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SwiftReposTests]
    dependencies:
      - target: SwiftRepos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cmu.dbaldsin.SwiftReposTests
schemes:
  SwiftRepos:
    build:
      targets:
        SwiftRepos: all
    test:
      targets: [SwiftReposTests]
